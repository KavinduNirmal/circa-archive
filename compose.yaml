name: circa-local

services:
  circa-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circa
      POSTGRES_USER: circa
      POSTGRES_PASSWORD: ${CIRCA_POSTGRES_PASSWORD:?Set CIRCA_POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${CIRCA_DB_PORT:-5432}:5432"
    volumes:
      - circa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circa -d circa"]
      interval: 5s
      timeout: 5s
      retries: 12

  circa-api:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${CIRCA_API_PORT:-5040}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Auth: Host=circa-db;Port=5432;Database=circa;Username=circa;Password=${CIRCA_POSTGRES_PASSWORD:?Set CIRCA_POSTGRES_PASSWORD in the root .env file}
      Auth__Issuer: http://localhost:${CIRCA_API_PORT:-5040}
      Auth__Audience: circa-local-client
      Auth__SigningKey: ${CIRCA_AUTH_SIGNING_KEY:?Set CIRCA_AUTH_SIGNING_KEY in the root .env file}
      Auth__RequireSecureCookies: "false"
      AllowedOrigins__0: http://localhost:${CIRCA_CLIENT_PORT:-3001}
      AllowedOrigins__1: http://127.0.0.1:${CIRCA_CLIENT_PORT:-3001}
      Database__InitializeOnStartup: "true"
      ReverseProxy__KnownProxies__0: ${CIRCA_PROXY_NETWORK_PREFIX:-172.30.0}.10
      ReverseProxy__KnownProxies__1: ${CIRCA_PROXY_NETWORK_PREFIX:-172.30.0}.11
    volumes:
      - circa_auth_keys:/home/app/.aspnet/DataProtection-Keys
    networks: [default, ingress]
    depends_on:
      circa-db:
        condition: service_healthy

  circa-client:
    build:
      context: ./client
    networks:
      ingress:
        ipv4_address: ${CIRCA_PROXY_NETWORK_PREFIX:-172.30.0}.11
    environment:
      NODE_ENV: development
      API_ORIGIN: http://circa-api:8080
      TRUST_PROXY_HEADERS: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CIRCA_LOW_RESOURCE: "1"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    depends_on:
      circa-api:
        condition: service_started

  circa-gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${CIRCA_CLIENT_PORT:-3001}:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      ingress:
        ipv4_address: ${CIRCA_PROXY_NETWORK_PREFIX:-172.30.0}.10
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://127.0.0.1:8080/api/v1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      circa-client:
        condition: service_healthy

networks:
  default: {}
  ingress:
    ipam:
      config:
        - subnet: ${CIRCA_PROXY_NETWORK_PREFIX:-172.30.0}.0/24

volumes:
  circa_postgres_data:
  circa_auth_keys:
