name: Feature proposal
description: Propose a product, design, or architecture improvement.
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: Read the product context and draft architecture before proposing changes.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Describe who benefits and what they need to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the change and how it fits CIRCA's project principles.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: textarea
    id: context
    attributes:
      label: Related specifications or issues
      description: Link relevant sections and identify any conflicts with existing decisions.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable outcomes that would make this proposal complete.
