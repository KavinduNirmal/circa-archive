map $http_upgrade $circa_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Replace claims at ingress; never append browser-supplied forwarding chains.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $circa_connection_upgrade;

    location /api/ {
        set $circa_api http://circa-api:8080;
        proxy_pass $circa_api;
    }

    location / {
        set $circa_frontend http://circa-client:3001;
        proxy_pass $circa_frontend;
    }
}
