map $http_upgrade $circa_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080 default_server;
    server_name ${ARCHIVE_HOST} localhost 127.0.0.1;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Replace claims at ingress; never append browser-supplied forwarding chains.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $circa_connection_upgrade;

    location = /healthz { access_log off; return 204; }
    location ~ ^/(en|ko)/meta/?$ {
        return 308 ${PROJECT_SITE_ORIGIN}/$1/$is_args$args;
    }
    location ~ ^/(en|ko)/meta/about/?$ {
        return 308 ${PROJECT_SITE_ORIGIN}/$1/about/project/$is_args$args;
    }
    location ~ ^/(en|ko)/meta/documentation(?:/overview)?/?$ {
        return 308 ${PROJECT_SITE_ORIGIN}/$1/documentation/$is_args$args;
    }
    location ~ ^/(en|ko)/meta/documentation/([a-z0-9-]+)/?$ {
        return 308 ${PROJECT_SITE_ORIGIN}/$1/documentation/$2/$is_args$args;
    }
    location /api/ {
        set $circa_api http://circa-api:8080;
        proxy_pass $circa_api;
    }
    location / {
        set $circa_frontend http://circa-client:3001;
        proxy_pass $circa_frontend;
    }
}

server {
    listen 8080;
    server_name ${PROJECT_HOST};
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /healthz { access_log off; return 204; }
    location / {
        set $circa_project http://circa-meta:8080;
        proxy_pass $circa_project;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
    }
}
